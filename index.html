<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Portal Akses | Royal Navy & Gold</title>
  <!-- Google Fonts: Cinzel & Poppins -->
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
  <!-- Link CSS Eksternal -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <h1 class="title" id="formTitle">Sign In</h1>
    <p class="subtitle" id="formSubtitle">Masukkan kredensial Anda untuk melanjutkan</p>

    <form id="authForm">
      <div class="input-group">
        <label for="username">Username</label>
        <input type="text" id="username" required autocomplete="off" placeholder="Nama pengguna">
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••">
      </div>

      <button type="submit" class="btn" id="submitBtn">Masuk</button>
    </form>

    <div id="messageBox" class="message"></div>

  <!-- Link JavaScript Eksternal -->
  <script src="script.js"></script>
</body>
</html>
